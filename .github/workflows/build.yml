name: Build

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
    # Changing only the readme or the screenshots doesn't need a new build.
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test the shared rules (money, backups, reports, demo shop)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build the app
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          mkdir -p ../dist
          VERSION=$(grep -E '^APP_VERSION' ../whitelabel/build.xcconfig | sed 's/.*= *//')
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/WhiteLabelPOS-$VERSION-android.apk"

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/scripts/screenshots.sh android/app/build/outputs/apk/debug/app-debug.apk dist/android-screenshots

      - name: Upload app and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WhiteLabelPOS-android
          path: |
            dist/*.apk
            dist/android-screenshots/*.png
          if-no-files-found: warn

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: android/app/build/reports/tests/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk

  ios:
    name: iPhone & iPad
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test the shared rules (money, backups, reports, demo shop)
        working-directory: ios/POSCore
        run: |
          swift test
          swift run core-check

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build the app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project WhiteLabelPOS.xcodeproj -scheme WhiteLabelPOS -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/WhiteLabelPOS.app

      - name: Build for a real iPhone (not signed)
        run: |
          set -o pipefail
          xcodebuild -project WhiteLabelPOS.xcodeproj -scheme WhiteLabelPOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Take screenshots in the simulator
        run: scripts/screenshots.sh build/DerivedData/Build/Products/Debug-iphonesimulator/WhiteLabelPOS.app ../dist/ios-screenshots

      - name: Pack the simulator app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          VERSION=$(grep -E '^APP_VERSION' ../whitelabel/build.xcconfig | sed 's/.*= *//')
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/dist/WhiteLabelPOS-$VERSION-ios-simulator.zip" WhiteLabelPOS.app

      - name: Upload app and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WhiteLabelPOS-ios
          path: |
            dist/*.zip
            dist/ios-screenshots/*.png
          if-no-files-found: warn
